<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hivyss</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #111018; font-family: 'Courier New', monospace; color: #ddd; overflow-x: hidden; }
    #wrap { width: 100%; margin: 0 auto; display: flex; flex-direction: column; }

    /* Header */
    #header { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #0c0c14; border-bottom: 1px solid #222; }
    #header h1 { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #f0c040; letter-spacing: 1px; }
    #stage-lbl { font-size: 10px; color: #666; letter-spacing: 2px; }
    .base-hpbar { display: flex; align-items: center; gap: 6px; }
    .base-hpbar span { font-size: 11px; min-width: 70px; }
    .hptrack { width: 110px; height: 7px; background: #1a1a22; border-radius: 2px; border: 1px solid #222; overflow: hidden; }
    .hpfill { height: 100%; border-radius: 2px; transition: width .15s; }
    #bhp-fill { background: linear-gradient(90deg, #1a6aaa, #5ac8f8); }
    #rhp-fill { background: linear-gradient(90deg, #aa2020, #f85050); }

    /* Canvas */
    #game-canvas canvas { display: block; cursor: default; image-rendering: pixelated; image-rendering: crisp-edges; }

    /* Resource bar — nectar + larvae */
    #resbar { display: flex; align-items: center; gap: 8px; padding: 4px 10px; background: #0e0e16; border-bottom: 1px solid #1a1a28; }
    .res-group { display: flex; align-items: center; gap: 6px; }
    .res-label { font-size: 9px; color: #666; letter-spacing: 0.5px; }
    #nectar-track { flex: 1; height: 10px; background: #1a1a22; border-radius: 5px; border: 1px solid #2a2a3a; overflow: hidden; }
    #nectar-fill { height: 100%; background: linear-gradient(90deg, #806010, #f0c040); border-radius: 5px; transition: width .1s; }
    #nectar-num { font-size: 13px; color: #f0c040; min-width: 40px; text-align: right; }
    #income-lbl { font-size: 10px; color: #664; }
    .res-sep { width: 1px; height: 14px; background: #222; margin: 0 4px; }
    #larvae-num { font-size: 13px; color: #c0b888; min-width: 30px; text-align: right; }
    #larvae-timer { font-size: 9px; color: #555; }

    /* Larva Mound — incubation chambers */
    #larva-mound { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 6px; background: #0b0b14; border-bottom: 1px solid #1a1a28; max-width: 600px; margin: 0 auto; width: 100%; justify-content: center; align-items: center; }
    #larva-counter { width: 100%; text-align: center; font-size: 10px; color: #8a8a6a; letter-spacing: 0.5px; padding: 1px 0; }
    #larva-counter.lc-empty { color: #c04040; }
    .lm-slot { width: 44px; height: 38px; background: #0e0e1a; border: 1px solid #222; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: default; transition: border-color .15s, background .15s; overflow: hidden; }
    .lm-slot.lm-empty { opacity: 0.3; }
    .lm-slot.lm-locked { opacity: 0.15; cursor: not-allowed; border-style: dashed; }
    .lm-slot.lm-active { border-color: #4a3c18; cursor: pointer; opacity: 1; }
    .lm-slot.lm-active:hover { border-color: #f0c040; background: #1a1410; }
    .lm-slot.lm-hatching { border-color: #80c040; animation: lm-pulse 0.5s infinite alternate; }
    @keyframes lm-pulse { from { border-color: #80c040; } to { border-color: #40a020; } }
    .lm-ico { font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; }
    .lm-empty-mark { font-size: 10px; color: #333; }
    .lm-lock { font-size: 9px; color: #333; font-weight: bold; }
    .lm-unit-name { font-size: 7px; color: #c8a020; }
    .lm-preview { width: 28px; height: 24px; object-fit: contain; image-rendering: pixelated; }
    .lm-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: #f0c040; transform-origin: left; transform: scaleX(0); transition: transform .1s; }
    .lm-timer { font-size: 8px; color: #c8a020; line-height: 1; margin-top: 1px; }

    /* Unit tray — 2-row grid */
    #tray { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; padding: 5px 6px; background: #0a0a12; border-bottom: 1px solid #1a1a28; max-width: 600px; margin: 0 auto; width: 100%; }
    .ucard { background: #0e0e1a; border: 1px solid #222; border-radius: 4px; padding: 4px 3px; cursor: pointer; user-select: none; transition: border-color .1s, filter .1s; display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; }
    .ucard:hover:not(.disabled) { border-color: #555; filter: brightness(1.25); }
    .ucard:active:not(.disabled) { transform: scale(0.97); }
    .ucard.disabled { opacity: .35; cursor: not-allowed; }
    .ucard .uico { font-size: 20px; line-height: 1; }
    .ucard .uico-img { width: 36px; height: 32px; object-fit: contain; image-rendering: pixelated; }
    .ucard .uname { font-size: 9px; font-weight: bold; text-align: center; line-height: 1.2; }
    .ucard .ucost { font-size: 10px; color: #f0c040; }
    .ucard .utier { position: absolute; top: 2px; left: 4px; font-family: 'Press Start 2P', monospace; font-size: 7px; font-weight: bold; opacity: 0.8; }
    .ucard .ucd-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: #f0c040; border-radius: 0 0 3px 3px; transform-origin: left; transition: transform .05s; }
    .ucard .utag { font-size: 8px; color: #888; text-align: center; }
    .ucard .ucd-bar { display: none; }

    /* Abilities */
    #abilities { display: flex; gap: 4px; padding: 4px 6px; background: #090910; border-bottom: 1px solid #1a1a28; max-width: 600px; margin: 0 auto; width: 100%; }
    .abl-btn { flex: 1; padding: 5px 4px; font-family: 'Courier New', monospace; font-size: 11px; cursor: pointer; border: 1px solid #333; background: #0d0d18; border-radius: 3px; color: #ccc; transition: filter .1s, border-color .1s; position: relative; overflow: hidden; text-align: center; }
    .abl-btn:hover:not(:disabled) { filter: brightness(1.3); border-color: #666; }
    .abl-btn:disabled { opacity: .3; cursor: not-allowed; }
    .abl-cd { position: absolute; bottom: 0; left: 0; height: 3px; background: #f0c040; transition: width .1s; }

    /* Log */
    #log-row { display: flex; gap: 4px; padding: 3px 8px; background: #080810; border-top: 1px solid #111; height: 28px; align-items: center; overflow: hidden; }
    #log-txt { font-size: 11px; color: #888; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Overlay */
    #overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(0,0,0,.88); z-index: 10; }
    #overlay.on { display: flex; }
    #ov-title { font-family: 'Press Start 2P', monospace; font-size: 20px; letter-spacing: 2px; }
    #ov-title.win { color: #5ac8f8; }
    #ov-title.lose { color: #f85050; }
    #ov-sub { font-size: 14px; color: #888; letter-spacing: 2px; }
    #ov-stats { font-size: 13px; color: #665520; line-height: 2; text-align: center; }
    #ov-restart { padding: 10px 24px; font-family: 'Press Start 2P', monospace; font-size: 9px; color: #f0c040; background: #150e04; border: 1px solid #f0c040; border-radius: 3px; cursor: pointer; letter-spacing: 1px; margin-top: 4px; }
    #ov-restart:hover { background: #201508; }
    #canvas-wrap { position: relative; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="header">
      <h1>&#x1FAB2; Hivyss</h1>
      <div id="stage-lbl">STAGE 1</div>
      <div class="base-hpbar">
        <span style="color:#5ac8f8" id="bhp-lbl">1000</span>
        <div class="hptrack"><div class="hpfill" id="bhp-fill" style="width:100%"></div></div>
        <div class="hptrack"><div class="hpfill" id="rhp-fill" style="width:100%"></div></div>
        <span style="color:#f85050;text-align:right" id="rhp-lbl">1000</span>
      </div>
    </div>
    <div id="canvas-wrap">
      <div id="game-canvas"></div>
      <div id="overlay">
        <div id="ov-title"></div>
        <div id="ov-sub"></div>
        <div id="ov-stats"></div>
        <button id="ov-restart">&#x25B6; PLAY AGAIN</button>
      </div>
    </div>
    <div id="resbar">
      <span class="res-label">NECTAR</span>
      <div id="nectar-track"><div id="nectar-fill" style="width:16%"></div></div>
      <span id="nectar-num">80</span>
      <span id="income-lbl">+8/s</span>
      <div class="res-sep"></div>
      <span class="res-label">LARVAE</span>
      <span id="larvae-num">3</span>
      <span id="larvae-timer"></span>
    </div>
    <div id="tray"></div>
    <div id="abilities"></div>
    <div id="log-row"><span id="log-txt">Deploy units to push to the enemy base!</span></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
