<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hivyss</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #111018; font-family: 'Courier New', monospace; color: #ddd; overflow-x: hidden; }
    #wrap { width: 100%; margin: 0 auto; display: flex; flex-direction: column; }

    /* Canvas */
    #game-canvas canvas { display: block; cursor: default; image-rendering: pixelated; image-rendering: crisp-edges; }

    /* Larva Mound slots (used by MenuUIScene DOM) */
    .lm-slot { width: 44px; height: 38px; background: #0e0e1a; border: 1px solid #222; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: default; transition: border-color .15s, background .15s; overflow: hidden; }
    .lm-slot.lm-empty { opacity: 0.3; }
    .lm-slot.lm-locked { opacity: 0.15; cursor: not-allowed; border-style: dashed; }
    .lm-slot.lm-active { border-color: #4a3c18; cursor: pointer; opacity: 1; }
    .lm-slot.lm-active:hover { border-color: #f0c040; background: #1a1410; }
    .lm-slot.lm-hatching { border-color: #80c040; animation: lm-pulse 0.5s infinite alternate; }
    @keyframes lm-pulse { from { border-color: #80c040; } to { border-color: #40a020; } }
    .lm-ico { font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; }
    .lm-empty-mark { font-size: 10px; color: #333; }
    .lm-lock { font-size: 9px; color: #333; font-weight: bold; }
    .lm-unit-name { font-size: 7px; color: #c8a020; }
    .lm-preview { width: 28px; height: 24px; object-fit: contain; image-rendering: pixelated; }
    .lm-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: #f0c040; transform-origin: left; transform: scaleX(0); transition: transform .1s; }
    .lm-timer { font-size: 8px; color: #c8a020; line-height: 1; margin-top: 1px; }
    .lc-empty { color: #c04040; }

    /* Unit cards (used by MenuUIScene DOM) */
    .ucard { width: 90px; height: 80px; background: #0e0e1a; border: 1px solid #222; border-radius: 4px; padding: 4px 3px; cursor: pointer; user-select: none; transition: border-color .1s, filter .1s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; position: relative; overflow: hidden; }
    .ucard:hover:not(.disabled) { border-color: #555; filter: brightness(1.25); }
    .ucard:active:not(.disabled) { transform: scale(0.97); }
    .ucard.disabled { opacity: .35; cursor: not-allowed; }
    .ucard .uico { font-size: 20px; line-height: 1; }
    .ucard .uico-img { width: 36px; height: 32px; object-fit: contain; image-rendering: pixelated; }
    .ucard .uname { font-size: 9px; font-weight: bold; text-align: center; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ucard .ucost { font-size: 9px; color: #f0c040; text-align: center; }
    .ucard .utier { position: absolute; top: 2px; left: 4px; font-family: 'Press Start 2P', monospace; font-size: 7px; font-weight: bold; opacity: 0.8; }
    .ucard .ucd-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: #f0c040; border-radius: 0 0 3px 3px; transform-origin: left; transition: transform .05s; display: none; }
    .ucard .utag { font-size: 8px; color: #888; text-align: center; }
    .ucard.selected { border-color: #60c040; background: #1a2a1a; }
    .ucard.selected:hover { border-color: #80e060; }

    /* Ability buttons (used by MenuUIScene DOM) */
    .abl-btn { flex: 1; padding: 5px 4px; font-family: 'Courier New', monospace; font-size: 11px; cursor: pointer; border: 1px solid #333; background: #0d0d18; border-radius: 3px; color: #ccc; transition: filter .1s, border-color .1s; position: relative; overflow: hidden; text-align: center; }
    .abl-btn:hover:not(:disabled) { filter: brightness(1.3); border-color: #666; }
    .abl-btn:disabled { opacity: .3; cursor: not-allowed; }
    .abl-cd { position: absolute; bottom: 0; left: 0; height: 3px; background: #f0c040; transition: width .1s; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="game-canvas"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
