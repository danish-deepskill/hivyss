<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hivyss</title>
  <link rel="preload" href="/fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('/fonts/press-start-2p.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #111018; font-family: 'Courier New', monospace; color: #ddd; overflow-x: hidden; }
    #wrap { width: 100%; margin: 0 auto; display: flex; flex-direction: column; }

    /* Canvas */
    #game-canvas canvas { display: block; cursor: default; image-rendering: pixelated; image-rendering: crisp-edges; }

    /* Larva Mound slots (used by MenuUIScene DOM) */
    .lm-slot { width: 44px; height: 38px; background: #0e0e1a; border: 1px solid #222; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: default; transition: border-color .15s, background .15s; overflow: hidden; }
    .lm-slot > * { pointer-events: none; }
    .lm-slot.lm-empty { opacity: 0.3; }
    .lm-slot.lm-locked { opacity: 0.15; cursor: not-allowed; border-style: dashed; }
    .lm-slot.lm-active { border-color: #4a3c18; cursor: pointer; opacity: 1; }
    .lm-slot.lm-active:hover { border-color: #f0c040; background: #1a1410; }
    .lm-slot.lm-hatching { border-color: #80c040; animation: lm-pulse 0.5s infinite alternate; }
    @keyframes lm-pulse { from { border-color: #80c040; } to { border-color: #40a020; } }
    .lm-ico { font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; }
    .lm-empty-mark { font-size: 10px; color: #333; }
    .lm-lock { font-size: 9px; color: #333; font-weight: bold; }
    .lm-unit-name { font-size: 7px; color: #c8a020; }
    .lm-preview { width: 28px; height: 24px; object-fit: contain; image-rendering: pixelated; }
    .lm-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: #f0c040; transform-origin: left; transform: scaleX(0); transition: transform .1s; }
    .lm-timer { font-size: 8px; color: #c8a020; line-height: 1; margin-top: 1px; }
    .lc-empty { color: #c04040; }

    /* Unit cards (used by MenuUIScene DOM) */
    .ucard { width: 90px; height: 80px; background: #0e0e1a; border: 1px solid #222; border-radius: 4px; padding: 4px 3px; cursor: pointer; user-select: none; transition: border-color .1s, filter .1s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; position: relative; overflow: hidden; }
    .ucard:hover:not(.disabled) { border-color: #555; filter: brightness(1.25); }
    .ucard:active:not(.disabled) { transform: scale(0.97); }
    .ucard.disabled { opacity: .35; cursor: not-allowed; }
    .ucard.cap-blocked { cursor: not-allowed; border-color: #c03030; background: #1a0808; animation: cap-blocked-pulse 1.4s ease-in-out infinite; }
    .ucard.cap-blocked .uico, .ucard.cap-blocked .uico-img { opacity: 0.2; filter: grayscale(1); }
    .ucard.cap-blocked .uname { color: #f06060; }
    .ucard.cap-blocked .ucap { color: #ff8080; font-weight: bold; }
    .ucard.cap-blocked::after { content: 'HIVE FULL'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -65%); font-size: 8px; font-weight: bold; color: #ff5050; letter-spacing: 1px; font-family: 'Press Start 2P', monospace; pointer-events: none; text-shadow: 0 0 4px #000, 0 0 2px #000; white-space: nowrap; }
    @keyframes cap-blocked-pulse { 0%,100% { border-color: #c03030; box-shadow: inset 0 0 0 1px #c03030; } 50% { border-color: #ff5050; box-shadow: inset 0 0 0 1px #ff5050, 0 0 8px rgba(255,80,80,0.4); } }
    .ucard .uico { font-size: 20px; line-height: 1; }
    .ucard .uico-img { width: 36px; height: 32px; object-fit: contain; image-rendering: pixelated; }
    .ucard .uname { font-size: 9px; font-weight: bold; text-align: center; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ucard .ucost-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .ucard .ucost { font-size: 9px; color: #f0c040; text-align: center; }
    .ucard .ucap { font-size: 9px; color: #40c0e0; text-align: center; font-family: 'Courier New', monospace; }
    .ucard .utier { position: absolute; top: 2px; left: 4px; font-family: 'Press Start 2P', monospace; font-size: 7px; font-weight: bold; opacity: 0.8; }
    .ucard .ucd-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: #f0c040; border-radius: 0 0 3px 3px; transform-origin: left; transition: transform .05s; display: none; }
    .ucard .utag { font-size: 8px; color: #888; text-align: center; }
    .ucard.selected { border-color: #60c040; background: #1a2a1a; }
    .ucard.selected:hover { border-color: #80e060; }

    /* Ability buttons (used by MenuUIScene DOM) */
    .abl-btn { flex: 1; padding: 5px 4px; font-family: 'Courier New', monospace; font-size: 11px; cursor: pointer; border: 1px solid #333; background: #0d0d18; border-radius: 3px; color: #ccc; transition: filter .1s, border-color .1s; position: relative; overflow: hidden; text-align: center; }
    .abl-btn:hover:not(:disabled) { filter: brightness(1.3); border-color: #666; }
    .abl-btn:disabled { opacity: .3; cursor: not-allowed; }
    .abl-cd { position: absolute; bottom: 0; left: 0; height: 3px; background: #f0c040; transition: width .1s; }

    /* Sandbox HUD (used by SandboxHUDScene DOM).
       Root has pointer-events:none so canvas right-drag pans through
       the HUD panel backdrop; interactive children re-enable auto. */
    .sb-hud, .sb-hud * { box-sizing: border-box; }
    .sb-hud__topbar { position: absolute; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 8px 20px; pointer-events: none; }
    .sb-hud__title { font-family: 'Press Start 2P', monospace; font-size: 14px; color: #f0c040; pointer-events: none; }
    .sb-hud__actions { display: flex; gap: 8px; align-items: center; }
    .sb-hud__back-btn, .sb-hud__action-btn { font-family: 'Press Start 2P', monospace; font-size: 13px; border: none; border-radius: 0; background: #0a0a14; color: #888; padding: 6px 12px; cursor: pointer; pointer-events: auto; transition: opacity .1s; }
    .sb-hud__back-btn:hover, .sb-hud__action-btn:hover { opacity: 0.7; }
    .sb-hud__clear-btn { color: #aaa; }
    .sb-hud__fight-btn { color: #f0c040; font-size: 16px; }
    .sb-hud__result-area { position: absolute; top: 400px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; }
    .sb-hud__result { font-family: 'Press Start 2P', monospace; font-size: 17px; color: #f0c040; }
    .sb-hud__stats { font-family: 'Courier New', monospace; font-size: 13px; color: #666; }
    .sb-hud__panel { position: absolute; bottom: 0; left: 0; right: 0; height: 240px; background: rgba(10, 10, 20, 0.85); border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; pointer-events: none; }
    .sb-hud__panel-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px 0; gap: 20px; pointer-events: none; }
    .sb-hud__header-left { display: flex; align-items: center; gap: 14px; }
    .sb-hud__selected { font-family: 'Press Start 2P', monospace; font-size: 11px; color: #ccc; pointer-events: none; }
    .sb-hud__count { font-family: 'Courier New', monospace; font-size: 11px; color: #888; pointer-events: none; }
    .sb-hud__count .sb-hud__count-p { color: #40c0ff; }
    .sb-hud__count .sb-hud__count-e { color: #ff6040; }
    .sb-hud__tooltip { position: absolute; display: none; background: #0a0a18; border: 1px solid #444466; border-radius: 6px; padding: 8px 12px; pointer-events: none; z-index: 200; width: 260px; font-family: 'Courier New', monospace; color: #ddd; }
    .sb-hud__presets { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
    .sb-hud__presets-label { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #888; }
    .sb-hud__preset-select { font-family: 'Courier New', monospace; font-size: 12px; background: #0a0a14; color: #ccc; border: 1px solid #333; padding: 4px 6px; cursor: pointer; min-width: 180px; }
    .sb-hud__preset-select:disabled { cursor: not-allowed; }
    .sb-hud__tabs { display: flex; justify-content: center; gap: 8px; margin-top: 10px; pointer-events: none; }
    .sb-hud__tab { width: 50px; padding: 6px 0; text-align: center; font-family: 'Press Start 2P', monospace; font-size: 14px; border: 1px solid #222; border-radius: 4px; background: #0e0e1a; color: #888; cursor: pointer; pointer-events: auto; transition: border-color .1s, filter .1s; }
    .sb-hud__tab:hover { border-color: #555; filter: brightness(1.25); }
    .sb-hud__tab--active { background: #1a2c40; color: #f0c040; border-color: #f0c040; }
    .sb-hud__roster { display: flex; justify-content: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; pointer-events: none; }
    .sb-hud__roster .ucard { pointer-events: auto; }
    .sb-hud__roster .ucost-row { display: none; }
    .sb-hud--running .sb-hud__mutator { opacity: 0.4; pointer-events: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="game-canvas"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
