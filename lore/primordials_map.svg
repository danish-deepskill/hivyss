  <text x="450" y="458" fill="#666688" font-size="11" font-style="italic" text-anchor="middle">before the shattering — the unnameable five</text>
  <text x="450" y="478" fill="#444466" font-size="9" font-style="italic" text-anchor="middle">all Greek and Phoenician are their fragments</text>
  <text x="450" y="270" fill="#a0c0ff" font-size="9" font-style="italic" text-anchor="middle">“I am, therefore everything else is.”</text>
  <text x="212" y="443" fill="#e090e0" font-size="9" font-style="italic" text-anchor="middle">“I was the first to choose to be something.”</text>
  <text x="303" y="722" fill="#e08070" font-size="9" font-style="italic" text-anchor="middle">“I was the first to want.”</text>
  <text x="597" y="722" fill="#80e0a0" font-size="9" font-style="italic" text-anchor="middle">“I refused to end with myself.”</text>
  <text x="688" y="443" fill="#d090ff" font-size="9" font-style="italic" text-anchor="middle">“I became something other than I was.”</text>
  <text x="450" y="825" fill="#555577" font-size="8" font-style="italic" text-anchor="middle">no edges connect them — each is a singular encounter</text>
  <text x="450" y="845" fill="#444466" font-size="8" font-style="italic" text-anchor="middle">no Greek or Phoenician will ever reach Quettavyss naturally</text>
  <text x="450" y="865" fill="#666688" font-size="8" font-style="italic" text-anchor="middle">to face one is to face the original of yourself</text>
</svg>