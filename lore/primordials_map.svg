  <text x="450" y="28" fill="#e0e0ff" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="4">THE PRIMORDIALS — pre-shatter wholeness</text>
  <text x="450" y="45" fill="#8090c0" font-size="9" text-anchor="middle">Ϸ Shei · ϯ Dei · ϥ Fei · ϫ Djandja · ϭ Tchima · all T10 (Quettavyss) · post-ω · post-ת</text>

